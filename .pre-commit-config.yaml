# Secret scanning strategy (2026 consensus):
#   gitleaks at the edge (here, pre-commit) + trufflehog --only-verified in CI.
# On ANY real hit: rotate the credential FIRST. Scrubbing history does not invalidate it.

repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args: ["--maxkb=5000"]
      - id: check-merge-conflict
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
      - id: check-json
